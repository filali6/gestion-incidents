<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Gestion des Incidents</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* REGISTER CARD */
        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px 40px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.2);
            max-width: 550px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* HEADER */
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            color: #2c3e50;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .register-header p {
            color: #7f8c8d;
            font-size: 15px;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        /* ALERTS */
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        /* FORM */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            color: #2c3e50;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* ERROR MESSAGES */
        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        /* BUTTON */
        .btn-register {
            width: 100%;
            background:  #667eea;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        /* FOOTER LINK */
        .footer-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ecf0f1;
            color: #7f8c8d;
            font-size: 14px;
        }

        .footer-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* REQUIRED */
        .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .register-card {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>

<div class="register-card">
    
    <!-- HEADER -->
    <div class="register-header">
        <div class="logo">🏙️</div>
        <h1>Inscription</h1>
        <p>Créez votre compte citoyen</p>
    </div>

    <!-- ALERT ERROR -->
    <div th:if="${errorMessage}" th:text="${errorMessage}" class="alert-danger">
        ❌ Erreur lors de l'inscription
    </div>

    <!-- FORM -->
    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- NOM -->
        <div class="form-group">
            <label>Nom <span class="required">*</span></label>
            <input type="text" th:field="*{nom}" placeholder="Votre nom" required />
            <span th:errors="*{nom}" class="error"></span>
        </div>

        <!-- PRÉNOM -->
        <div class="form-group">
            <label>Prénom <span class="required">*</span></label>
            <input type="text" th:field="*{prenom}" placeholder="Votre prénom" required />
            <span th:errors="*{prenom}" class="error"></span>
        </div>

        <!-- EMAIL -->
        <div class="form-group">
            <label>Email <span class="required">*</span></label>
            <input type="email" th:field="*{email}" placeholder="exemple@email.com" required />
            <span th:errors="*{email}" class="error"></span>
        </div>

        <!-- MOT DE PASSE -->
        <div class="form-group">
            <label>Mot de passe <span class="required">*</span></label>
            <input type="password" th:field="*{motDePasse}" placeholder="Minimum 6 caractères" required />
            <span th:errors="*{motDePasse}" class="error"></span>
        </div>

        <!-- CONFIRMER MOT DE PASSE -->
        <div class="form-group">
            <label>Confirmer le mot de passe <span class="required">*</span></label>
            <input type="password" th:field="*{confirmMotDePasse}" placeholder="Retapez votre mot de passe" required />
        </div>

        <!-- TÉLÉPHONE -->
        <div class="form-group">
            <label>Téléphone</label>
            <input type="text" th:field="*{telephone}" placeholder="+216 XX XXX XXX" />
        </div>

        <!-- SUBMIT -->
        <button type="submit" class="btn-register"> Créer mon compte</button>
    </form>

    <!-- FOOTER LINK -->
    <div class="footer-link">
        Déjà inscrit ? <a th:href="@{/login}">Se connecter</a>
    </div>
</div>

</body>
</html>
