<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion des Incidents</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* LOGIN CARD */
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 45px 40px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
        }

        /* HEADER */
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header h1 {
            color: #2c3e50;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #7f8c8d;
            font-size: 15px;
        }

        .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }

        /* ALERTS */
        .alert {
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        /* FORM */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            color: #2c3e50;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* BUTTON */
        .btn-login {
            width: 100%;
            background:  #667eea  ;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* FOOTER LINK */
        .footer-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #ecf0f1;
            color: #7f8c8d;
            font-size: 14px;
        }

        .footer-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .login-card {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    
    <!-- HEADER -->
    <div class="login-header">
        <div class="logo">🏙️</div>
        <h1>Connexion</h1>
        <p>Accédez à votre espace  </p>
    </div>

    <!-- ALERTS -->
    <div th:if="${param.verified}" class="alert alert-success">
        ✅ Email vérifié avec succès. Vous pouvez maintenant vous connecter.
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        ❌ Email ou mot de passe incorrect, ou compte non activé.
    </div>

    <div th:if="${param.logout}" class="alert alert-info">
        ℹ️ Vous avez été déconnecté avec succès.
    </div>

    <!-- FORM -->
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" name="username" placeholder="exemple@email.com" required />
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input id="password" type="password" name="password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-login">Se connecter</button>
    </form>

    <!-- FOOTER LINK -->
    <div class="footer-link">
        Pas encore inscrit ? <a th:href="@{/register}">Créer un compte</a>
    </div>
</div>

</body>
</html>
